<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="k8sBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326ce5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="28" cy="28" r="0.75" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Dynamic Keyframe Animations -->
    <style>
      @keyframes scanSweep {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.7; }
        100% { transform: translateY(240px); opacity: 0.15; }
      }
      @keyframes floatK8sNode {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(2deg); }
      }
      @keyframes floatK8sNodeRev {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(6px) rotate(-2deg); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlowRing {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .scanner-beam { animation: scanSweep 6s infinite ease-in-out; }
      .floating-node-left { animation: floatK8sNode 5s infinite ease-in-out; transform-origin: 75px 120px; }
      .floating-node-right { animation: floatK8sNodeRev 6s infinite ease-in-out; transform-origin: 825px 120px; }
      .mesh-line { stroke-dasharray: 6, 6; animation: dashFlow 4s infinite linear; }
      .ring-pulse { animation: pulseGlowRing 3.5s infinite ease-in-out; transform-origin: center; }
      .orbit-spin { animation: orbitRotate 14s infinite linear; transform-origin: 75px 120px; }
      .orbit-spin-rev { animation: orbitRotate 18s infinite linear reverse; transform-origin: 825px 120px; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', sans-serif; font-weight: 600; font-size: 11px; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>

  <!-- Scanning Sweep Line (Background Animation) -->
  <rect class="scanner-beam" x="0" y="0" width="900" height="2" fill="url(#scanGrad)"/>

  <!-- Left Side: Visual Kubernetes Virtualization Emblem -->
  <g class="floating-node-left">
    <!-- Outer Orbit Ring -->
    <circle cx="75" cy="120" r="54" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8, 6" opacity="0.35" class="ring-pulse"/>
    <!-- Orbiting satellite nodes -->
    <g class="orbit-spin">
      <circle cx="75" cy="66" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="129" cy="120" r="3.5" fill="#818cf8" filter="url(#glow)"/>
      <circle cx="75" cy="174" r="3" fill="#c084fc"/>
    </g>
    <!-- Host Cluster Center Disk -->
    <circle cx="75" cy="120" r="36" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Nested Virtual Clusters (Inner Hexagons) -->
    <path d="M 75 97 L 91 106 L 91 125 L 75 134 L 59 125 L 59 106 Z" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Inner vCluster Core -->
    <circle cx="75" cy="116" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="75" cy="116" r="3" fill="#ffffff"/>
  </g>

  <!-- Right Side: Virtual Cluster Hierarchy Emblem -->
  <g class="floating-node-right">
    <circle cx="825" cy="120" r="54" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6, 6" opacity="0.35" class="ring-pulse"/>
    <g class="orbit-spin-rev">
      <circle cx="825" cy="66" r="3.5" fill="#a855f7" filter="url(#glow)"/>
      <circle cx="771" cy="120" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="825" cy="174" r="3" fill="#60a5fa"/>
    </g>
    <circle cx="825" cy="120" r="36" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Nested cluster symbol -->
    <rect x="811" y="106" width="28" height="28" rx="6" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="825" cy="120" r="5" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="825" cy="120" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Connecting Dynamic Mesh Lines -->
  <path class="mesh-line" d="M 130 120 Q 250 80, 450 80 T 770 120" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.25"/>
  <path class="mesh-line" d="M 130 135 Q 300 170, 450 170 T 770 135" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.25"/>

  <!-- Top Decorative Border Accent -->
  <rect x="40" y="0" width="820" height="3" fill="url(#accentGrad)" rx="1.5"/>

  <!-- Center Foreground Content: Guaranteed crisp contrast & visibility -->
  <!-- Top Category Eyebrow -->
  <g transform="translate(450, 48)">
    <rect x="-140" y="-14" width="280" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="-120" cy="-3" r="4" fill="#10b981"/>
    <text x="-108" y="1" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5" class="title-text">CLOUD-NATIVE &#8226; MULTI-TENANCY</text>
  </g>

  <!-- Main Title -->
  <text class="title-text" x="450" y="104" text-anchor="middle" fill="url(#titleGrad)" font-size="34" font-weight="900" letter-spacing="0.5" filter="url(#dropGlow)">AWESOME VIRTUAL KUBERNETES</text>

  <!-- Subtitle -->
  <text class="title-text" x="450" y="138" text-anchor="middle" fill="#cbd5e1" font-size="14.5" font-weight="500" letter-spacing="0.3">
    Curated Hub for Virtual Clusters &#8226; Nested Control Planes &#8226; vCluster &#8226; KaaS
  </text>

  <!-- Foreground Pill Badges (Non-overlapping) -->
  <g transform="translate(450, 182)">
    <!-- Pill 1: Virtual Clusters -->
    <g transform="translate(-235, -13)">
      <rect x="0" y="0" width="145" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <text x="72" y="17" text-anchor="middle" fill="#38bdf8" class="badge-text">&#x2699;&#xfe0f; vCluster &amp; Nested</text>
    </g>
    <!-- Pill 2: Multi-Tenancy -->
    <g transform="translate(-75, -13)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
      <text x="75" y="17" text-anchor="middle" fill="#a5b4fc" class="badge-text">&#x1f6e1;&#xfe0f; Tenant Isolation</text>
    </g>
    <!-- Pill 3: FinOps & Density -->
    <g transform="translate(90, -13)">
      <rect x="0" y="0" width="145" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
      <text x="72" y="17" text-anchor="middle" fill="#6ee7b7" class="badge-text">&#x1f4b0; High Density &amp; FinOps</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="180" y="238" width="540" height="2" fill="url(#accentGrad)" rx="1"/>
</svg>
